<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b6b55"/>
      <stop offset="100%" stop-color="#0c3024"/>
    </linearGradient>
    <linearGradient id="glow" x1="13" y1="13" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Squircle container -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#34d399" stroke-opacity="0.25"/>
  
  <!-- Biometric face-detection corner brackets -->
  <path d="M 10 15 L 10 12 A 2 2 0 0 1 12 10 L 15 10" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 25 10 L 28 10 A 2 2 0 0 1 30 12 L 30 15" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 30 25 L 30 28 A 2 2 0 0 1 28 30 L 25 30" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 15 30 L 12 30 A 2 2 0 0 1 10 28 L 10 25" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Optical vision lens / pupil -->
  <circle cx="20" cy="20" r="5" fill="url(#glow)"/>
  <circle cx="20" cy="20" r="2.2" fill="#0c3024"/>
  <circle cx="21" cy="19" r="0.75" fill="#ffffff" opacity="0.95"/>
</svg>
