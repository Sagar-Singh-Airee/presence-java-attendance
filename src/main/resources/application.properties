# Purpose: Main application settings.
# Why it is used: It controls the web address, camera number, file limits, and face-recognition settings without changing Java code.
spring.application.name=SmartVision
server.address=127.0.0.1
server.port=8080
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=16MB
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false

presence.data-directory=data
presence.camera-index=0
presence.recognition-threshold=75.0
presence.frame-width=640
presence.frame-height=480

